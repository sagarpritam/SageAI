image: python:3.13-slim

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "api"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DATABASE_URL: "sqlite+aiosqlite:///./test.db"
  SECRET_KEY: "test-secret-key-for-ci"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

cache:
  paths:
    - .cache/pip

stages:
  - lint
  - test
  - security
  - frontend

lint:
  stage: lint
  script:
    - pip install "ruff>=0.15.9" mypy
    - ruff check app/ tests/ scripts/ sagestrike/ alembic/
    - ruff format --check app/ tests/ scripts/ sagestrike/ alembic/
    - mypy app/ sagestrike/ scripts/ tests/ alembic/ --ignore-missing-imports --check-untyped-defs

test:
  stage: test
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - rm -f test.db alembic_ci.db
    - DATABASE_URL="sqlite+aiosqlite:///./alembic_ci.db" python -m alembic upgrade head
    - DATABASE_URL="sqlite+aiosqlite:///./alembic_ci.db" python -m alembic check
    - rm -f alembic_ci.db
    - pytest tests/ -v --tb=short

security:
  stage: security
  script:
    - pip install bandit
    - bandit -r app/ sagestrike/ -ll
  allow_failure: false

frontend:
  stage: frontend
  image: node:22-alpine
  script:
    - cd sage-web
    - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - npm run lint
    - npm run build
