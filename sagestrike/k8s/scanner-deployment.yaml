apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagestrike-scanner
  namespace: sagestrike
  labels:
    app: sagestrike-scanner
spec:
  replicas: 10
  selector:
    matchLabels:
      app: sagestrike-scanner
  template:
    metadata:
      labels:
        app: sagestrike-scanner
    spec:
      containers:
      - name: scanner
        image: sageai/sagestrike-scanner:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: GOMAXPROCS
          value: "2"
        ports:
        - containerPort: 8080
          name: metrics
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sagestrike-scanner
  namespace: sagestrike
  labels:
    app: sagestrike-scanner
spec:
  selector:
    app: sagestrike-scanner
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sagestrike-scanner
  namespace: sagestrike
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sagestrike-scanner
  minReplicas: 5
  maxReplicas: 100
  metrics:
  - type: External
    external:
      metric:
        name: kafka_consumer_lag
      target:
        type: AverageValue
        averageValue: "1000"
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
