[project]
name = "sageai"
version = "2.0.0"
description = "SageAI Security Scanner"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "venv2",
    "__pypackages__",
    "node_modules",
    "frontend",
    "sage-web",
    "sagestrike",
    "sageai---autonomous-pentesting",
    "alembic",
    ".agent",
    ".agents",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = ["E501", "B008", "B904", "B905", "E402", "B017"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --asyncio-mode=auto"
pythonpath = ["."]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
