# ================================
# SageAI Frontend — Deployment + Service
# ================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sageai
  labels:
    app: sageai-frontend
    version: "2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sageai-frontend
  template:
    metadata:
      labels:
        app: sageai-frontend
        version: "2.0"
    spec:
      containers:
        - name: frontend
          image: sageai/frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: sageai-config
            - secretRef:
                name: sageai-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sageai
spec:
  selector:
    app: sageai-frontend
  ports:
    - port: 80
      targetPort: 3000
