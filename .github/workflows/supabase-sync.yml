name: Supabase CI/CD & Schema Sync

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  pull_request:
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  supabase-sync:
    name: Supabase Database Migration & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migration Files
        run: |
          echo "Verifying local Supabase migrations..."
          ls -la supabase/migrations

      - name: Link to Supabase Project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref jiawtheciauiwhcgswde
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Migrations to Production Supabase
        if: github.ref == 'refs/heads/main' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

