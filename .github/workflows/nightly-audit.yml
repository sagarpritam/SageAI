name: Nightly AI Security Audit

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM every night
  workflow_dispatch:      # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sage-web/package-lock.json

      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Frontend Sanity Check (Lint & Build)
        working-directory: sage-web
        run: |
          npm install --legacy-peer-deps
          npm run lint
          npm run build

      - name: Run AI Security & Resilience Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "test-secret-key-for-ci"
        run: |
          pytest tests/test_ai_resilience.py tests/test_ai_model.py tests/test_nvidia_llm.py tests/test_llm_gateway.py tests/test_phase05_observability.py -v --tb=short

      - name: Run Live AI Security & NeMo Audit
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AUDITOR_BASE_URL: ${{ secrets.AUDITOR_BASE_URL }}
        run: |
          python scripts/verify_nvidia_live.py --output audit_report.txt

      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: audit_report.txt
