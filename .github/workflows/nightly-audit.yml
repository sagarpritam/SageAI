name: Nightly AI Security Audit

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM every night
  workflow_dispatch:      # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Frontend Sanity Check (Lint & Build)
        working-directory: sage-web
        run: |
          npm ci
          npm run lint || true
          npm run build

      - name: Run NeMo Security Audit
        env:
          NVIDIA_API_KEY: ${{ secrets['NVIDIA_API_KEY'] }}
          AUDITOR_BASE_URL: ${{ secrets['AUDITOR_BASE_URL'] }}
        run: |
          # Trigger a scan of configured LLM targets
          python scripts/verify_nvidia_live.py

      - name: Generate Audit Report
        run: |
          echo "AI Security Audit completed at $(date)" > audit_report.txt

      - name: Upload Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: audit_report.txt
