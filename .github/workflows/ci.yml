name: SageAI CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ––– Lint + SAST –––
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff bandit mypy safety alembic
      - run: ruff check app/ tests/ scripts/ sagestrike/ alembic/
      - run: ruff format --check app/ tests/ scripts/ sagestrike/ alembic/
      - run: mypy app/ sagestrike/ scripts/ tests/ alembic/ --ignore-missing-imports --check-untyped-defs
      - run: safety check --full-report || true # Don't fail yet, just report
      - run: bandit -r app/ sagestrike/ -f json -o bandit-report.json --severity-level medium || true
      - run: bandit -r app/ sagestrike/ --severity-level medium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ––– Dependency Scanning (Trivy) –––
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — scan Python dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "table"

  # ––– Backend Tests + Alembic Migration Check –––
  test-backend:
    runs-on: ubuntu-latest
    needs: [lint-and-security]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sageai_test
          POSTGRES_USER: sageai
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Alembic migration check
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic check
        env:
          DATABASE_URL: "postgresql+asyncpg://sageai:test_password@localhost:5432/sageai_test"
          SECRET_KEY: "test-secret-key-for-ci"

      - run: pytest tests/ -v --tb=short --cov=app
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "test-secret-key-for-ci"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # ––– Frontend Build –––
  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-and-security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install, Lint, Build & Run E2E Tests (Next.js)
        working-directory: sage-web
        run: |
          npm install --legacy-peer-deps
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  # ––– Docker Build + Security Scan –––
  docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, dependency-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose configs & production Dockerfiles
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml --env-file .env.production.example config --quiet
          docker compose -f docker/docker-compose.yml config --quiet
          docker build -t sageai-backend-prod -f docker/Dockerfile.backend .
          docker build -t sageai-frontend-prod -f docker/Dockerfile.frontend .

      - name: Build full stack
        run: docker compose build

      - name: Trivy — scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sageai-backend"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "table"

      - name: Trivy — scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sageai-frontend"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "table"
