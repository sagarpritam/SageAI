name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - release/prod
      - deploy

env:
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Backend Image
        run: |
          gcloud auth configure-docker --quiet
          docker build -t gcr.io/$PROJECT_ID/sageai-backend:${{ github.sha }} -f docker/Dockerfile.backend .
          docker push gcr.io/$PROJECT_ID/sageai-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        run: |
          docker build -t gcr.io/$PROJECT_ID/sageai-frontend:${{ github.sha }} -f docker/Dockerfile.frontend .
          docker push gcr.io/$PROJECT_ID/sageai-frontend:${{ github.sha }}

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sageai-backend
          image: gcr.io/${{ env.PROJECT_ID }}/sageai-backend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --memory=1Gi --cpu=1 --timeout=120 --max-instances=5 --port=8000'
          env_vars: |-
            ENV=production
            DEBUG=false
            WEB_CONCURRENCY=2
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            AI_GATEWAY_API_KEY=${{ secrets.AI_GATEWAY_API_KEY }}
            AI_GATEWAY_URL=${{ secrets.AI_GATEWAY_URL || 'https://ai-gateway.vercel.sh/v1' }}
            INTERNAL_SERVICE_KEY=${{ secrets.INTERNAL_SERVICE_KEY || secrets.PROD_SECRET_KEY }}
            CORS_ORIGINS="${{ secrets.PROD_CORS_ORIGINS || 'https://sageai-security-platform.vercel.app,https://sageai-sec-v2.vercel.app,https://sageai-v1.vercel.app,https://sageai-v1-unique.vercel.app,https://sageai-sec-v3-unique.vercel.app,https://sage-ai-02.vercel.app,https://sage-web-sagarpritams-projects.vercel.app,https://sage-ai-sagarpritams-projects.vercel.app,https://sageai.io,https://app.sageai.io' }}"

      - name: Deploy Frontend to Cloud Run
        env:
          FRONTEND_INTERNAL_KEY: ${{ secrets.INTERNAL_SERVICE_KEY || secrets.PROD_SECRET_KEY }}
        run: |
          BACKEND_URL=$(gcloud run services describe sageai-backend --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Frontend will connect to Backend URL: $BACKEND_URL"
          BACKEND_URL="$BACKEND_URL" python3 - <<'PY' > /tmp/frontend-env.yaml
          import json, os
          for k, v in (
              ("NODE_ENV", "production"),
              ("BACKEND_URL", os.environ["BACKEND_URL"]),
              ("INTERNAL_SERVICE_KEY", os.environ.get("FRONTEND_INTERNAL_KEY", "")),
          ):
              print(f"{k}: {json.dumps(v)}")
          PY
          gcloud run deploy sageai-frontend \
            --image gcr.io/${{ env.PROJECT_ID }}/sageai-frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --max-instances 5 \
            --allow-unauthenticated \
            --quiet \
            --env-vars-file /tmp/frontend-env.yaml
          rm -f /tmp/frontend-env.yaml

      - name: Verify Live Endpoints & Health Check
        run: |
          BACKEND_URL=$(gcloud run services describe sageai-backend --region ${{ env.REGION }} --format 'value(status.url)')
          FRONTEND_URL=$(gcloud run services describe sageai-frontend --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Verifying Backend endpoint: $BACKEND_URL"
          curl --fail --retry 5 --retry-delay 3 "$BACKEND_URL/health"
          echo ""
          echo "Verifying Backend DB readiness: $BACKEND_URL/health/ready"
          curl --fail --retry 3 --retry-delay 2 "$BACKEND_URL/health/ready"
          echo ""
          echo "Verifying Frontend endpoint: $FRONTEND_URL"
          STATUS=$(curl --fail --retry 5 --retry-delay 3 -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
          echo "Frontend HTTP status: $STATUS"
          test "$STATUS" -ge 200 -a "$STATUS" -lt 400

      - name: Deployment Summary & Live URLs
        if: always()
        run: |
          BACKEND_URL=$(gcloud run services describe sageai-backend --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "N/A")
          FRONTEND_URL=$(gcloud run services describe sageai-frontend --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "N/A")
          echo "=========================================="
          echo "🚀 Cloud Run Deployment Complete"
          echo "Backend API:  $BACKEND_URL"
          echo "Frontend UI:  $FRONTEND_URL"
          echo "=========================================="
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### 🚀 Cloud Run Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Cloud Run URL |" >> $GITHUB_STEP_SUMMARY
            echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
            echo "| **Backend API** | [\`$BACKEND_URL\`]($BACKEND_URL) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Frontend UI** | [\`$FRONTEND_URL\`]($FRONTEND_URL) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Metadata:**" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Region:** \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **GCP Project:** \`${{ env.PROJECT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          fi
