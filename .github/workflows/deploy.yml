name: Deploy to Cloud Run

on:
  workflow_dispatch:

env:
  REGION: us-central1
  SERVICE_NAME: sageai-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets['GCP_PROJECT_ID'] }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets['GCP_SA_KEY'] }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Backend Image
        run: |
          gcloud auth configure-docker
          docker build -t gcr.io/$PROJECT_ID/sageai-backend:${{ github.sha }} -f docker/Dockerfile.backend .
          docker push gcr.io/$PROJECT_ID/sageai-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        run: |
          docker build -t gcr.io/$PROJECT_ID/sageai-frontend:${{ github.sha }} -f docker/Dockerfile.frontend .
          docker push gcr.io/$PROJECT_ID/sageai-frontend:${{ github.sha }}

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sageai-backend
          image: gcr.io/${{ env.PROJECT_ID }}/sageai-backend:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            ENV=production
            DATABASE_URL=${{ secrets['PROD_DATABASE_URL'] }}
            SECRET_KEY=${{ secrets['PROD_SECRET_KEY'] }}
            NVIDIA_API_KEY=${{ secrets['NVIDIA_API_KEY'] }}

      - name: Deploy Frontend to Cloud Run
        run: |
          BACKEND_URL=$(gcloud run services describe sageai-backend --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Frontend will connect to Backend URL: $BACKEND_URL"
          gcloud run deploy sageai-frontend \
            --image gcr.io/${{ env.PROJECT_ID }}/sageai-frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --set-env-vars NODE_ENV=production,BACKEND_URL=$BACKEND_URL
