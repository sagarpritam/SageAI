name: SageAI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
    - name: Run Pytest
      run: |
        pytest -v tests/ --cov=app

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sage-web
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: './sage-web/package-lock.json'
    - name: Install dependencies
      run: npm ci
    - name: Build Next.js
      run: npm run build

  docker-build:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Backend Image
      run: docker build -t sageai/backend:latest .
      
    - name: Build Frontend Image
      run: docker build -t sageai/frontend:latest ./sage-web

    - name: Verify Docker Compose
      run: docker compose -f docker-compose.yml config
