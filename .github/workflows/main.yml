name: SageAI CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
    - name: Verify Alembic Migrations (Clean SQLite)
      run: |
        rm -f alembic_ci.db
        python -m alembic heads
        python -m alembic upgrade head
        python -m alembic check
        rm -f alembic_ci.db
      env:
        DATABASE_URL: "sqlite+aiosqlite:///./alembic_ci.db"
        SECRET_KEY: "test-secret-key-for-ci"
    - name: Run Pytest
      run: |
        pytest -v tests/ --cov=app
      env:
        DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        SECRET_KEY: "test-secret-key-for-ci"
        ALGORITHM: "HS256"
        ACCESS_TOKEN_EXPIRE_MINUTES: "60"
        REFRESH_TOKEN_EXPIRE_DAYS: "7"

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sage-web
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: './sage-web/package-lock.json'
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Build Next.js
      run: npm run build

  docker-build:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Backend Image
      run: |
        docker build -t sageai/backend:latest .
        docker build -t sageai/backend-prod:latest -f docker/Dockerfile.backend .
      
    - name: Build Frontend Image
      run: |
        docker build -t sageai/frontend:latest ./sage-web
        docker build -t sageai/frontend-prod:latest -f docker/Dockerfile.frontend .

    - name: Verify Docker Compose
      run: |
        docker compose -f docker-compose.yml config --quiet
        docker compose -f docker-compose.prod.yml --env-file .env.production.example config --quiet
        docker compose -f docker/docker-compose.yml config --quiet
