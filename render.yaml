# ================================
# SageAI — Render Blueprint (100% Free Tier)
# https://render.com/docs/blueprint-spec
# ================================

services:
  # FastAPI Backend (Free Tier)
  - type: web
    name: SageAI-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/migrate.py && gunicorn app.main:app -c gunicorn.conf.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: SageAI-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: APP_NAME
        value: SageAI Security Scanner
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT
        value: 60/minute
      - key: CORS_ORIGINS
        value: https://sageai-dashboard.onrender.com,https://sage-web.vercel.app
      - key: FRONTEND_URL
        value: https://sageai-dashboard.onrender.com
      - key: PYTHON_VERSION
        value: 3.13.0

  # Next.js Frontend (Free Tier)
  - type: web
    name: SageAI-dashboard
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd sage-web && npm install --legacy-peer-deps && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: cd sage-web && HOSTNAME=0.0.0.0 PORT=${PORT:-10000} node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: https://sageai-api.onrender.com
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  # Free PostgreSQL Database (Or connect free Supabase via DATABASE_URL)
  - name: SageAI-db
    plan: free
    databaseName: sageai
    user: sageai
